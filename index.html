<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050a14" />
    <meta name="description" content="Desiglo Games: small, polished browser games made by the Desiglo studio. Play Glass Blast: Block Puzzle and see what's coming next." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      try {
        var t = localStorage.getItem("desiglo-theme");
        document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
      } catch (e) {}
    </script>
    <title>Games — Desiglo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
